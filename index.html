<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Authentication</title>
    <style>
        :root {
            --accent: #0088cc;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #1e3a8a 0%, #020617 100%);
            font-family: 'Inter', -apple-system, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Анимированный фон (жидкое стекло) */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--accent);
            filter: blur(150px);
            border-radius: 50%;
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-30%, -30%); }
            to { transform: translate(30%, 30%); }
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 50px 30px;
            width: 360px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        h2 { font-weight: 500; margin-bottom: 15px; letter-spacing: 1px; }
        p { opacity: 0.5; font-size: 14px; margin-bottom: 30px; line-height: 1.4; }

        #tg-container {
            display: flex;
            justify-content: center;
        }

        .data-display {
            display: none;
            text-align: left;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.2);
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <h2>Cloud Verification</h2>
    <p>Для синхронизации профиля подтвердите доступ через официальный шлюз Telegram</p>
    
    <div id="tg-container">
        <script async src="https://oauth.telegram.org/js/telegram-login.js?22" 
                data-telegram-login="8791295405" 
                data-size="large" 
                data-radius="15"
                data-onauth="onTelegramAuth(user)" 
                data-request-access="write"></script>
    </div>

    <div id="result" class="data-display"></div>
</div>

<script>
    function onTelegramAuth(user) {
        // Убираем кнопку и текст
        document.getElementById('tg-container').style.display = 'none';
        document.querySelector('p').style.display = 'none';
        
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';
        
        // Выводим только реальные данные, которые отдал Telegram
        resDiv.innerHTML = `
            <b style="color:white">ДАННЫЕ ПОЛУЧЕНЫ:</b><br><br>
            ID: ${user.id}<br>
            NAME: ${user.first_name} ${user.last_name || ''}<br>
            USER: @${user.username || 'не указан'}<br>
            AUTH_DATE: ${new Date(user.auth_date * 1000).toLocaleString()}<br>
            <br>
            <span style="color:#4ade80">> Сессия активна</span>
        `;
        
        // Отправка в консоль для тебя
        console.log("Данные профиля:", user);
    }
</script>

</body>
</html>
