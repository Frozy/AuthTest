<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>System Kernel v7.0</title>
    <style>
        :root { --blue: #0088cc; --glass: rgba(255, 255, 255, 0.05); }
        body {
            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at top right, #1e3a8a, #020617);
            font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden;
        }
        .card {
            background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 40px;
            padding: 50px; width: 380px; text-align: center; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
        }
        .btn-init {
            width: 100%; padding: 18px; background: linear-gradient(135deg, var(--blue), #004466);
            border: none; border-radius: 20px; color: white; font-weight: bold; cursor: pointer;
            transition: 0.4s; box-shadow: 0 10px 30px rgba(0, 136, 204, 0.3);
        }
        .btn-init:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0, 136, 204, 0.5); }
        
        #result-box {
            display: none; text-align: left; background: rgba(0,0,0,0.4);
            padding: 20px; border-radius: 20px; font-family: monospace; font-size: 13px;
            border: 1px solid rgba(0, 212, 255, 0.3); margin-top: 20px;
        }
        .label { color: #00d4ff; font-weight: bold; }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <h2 id="title">SYSTEM SYNC</h2>
    <p id="status">Ожидание инициализации протокола...</p>
    
    <button class="btn-init" id="btn" onclick="openAuth()">ИНИЦИАЛИЗИРОВАТЬ</button>

    <div id="result-box">
        <div id="user-data"></div>
    </div>
</div>

<script>
    // 1. ВСТАВЬ АЙДИ БОТА (ЦИФРЫ)
    const botId = "8791295405"; 

    // Функция проверки параметров в ссылке (срабатывает после редиректа)
    function checkAuth() {
        const urlParams = new URLSearchParams(window.location.search);
        const userStr = urlParams.get('tgAuthResult'); // Telegram иногда пакует в этот параметр
        
        // Если данные пришли в строке запроса напрямую (стандарт OAuth)
        if (urlParams.has('id')) {
            const user = {
                id: urlParams.get('id'),
                first_name: urlParams.get('first_name'),
                last_name: urlParams.get('last_name'),
                username: urlParams.get('username'),
                hash: urlParams.get('hash')
            };
            showData(user);
        }
    }

    function openAuth() {
        const origin = window.location.origin + window.location.pathname;
        // Используем механизм прямой авторизации с возвратом на эту же страницу
        const authUrl = `https://oauth.telegram.org/auth?bot_id=${botId}&origin=${origin}&request_access=write`;
        
        // Перенаправляем ТЕКУЩУЮ вкладку (так надежнее всего для перехвата данных)
        window.location.href = authUrl;
    }

    function showData(user) {
        document.getElementById('btn').style.display = 'none';
        document.getElementById('status').style.display = 'none';
        document.getElementById('title').innerText = "DATA EXTRACTED";
        
        const box = document.getElementById('result-box');
        const dataDiv = document.getElementById('user-data');
        box.style.display = 'block';

        dataDiv.innerHTML = `
            <span class="label">ID:</span> ${user.id}<br>
            <span class="label">NAME:</span> ${decodeURIComponent(user.first_name)} ${decodeURIComponent(user.last_name || '')}<br>
            <span class="label">USERNAME:</span> @${user.username || 'n/a'}<br>
            <span class="label">HASH:</span> ${user.hash.substring(0, 12)}...<br><br>
            <span style="color: #4ade80;">> Данные профиля синхронизированы.</span>
        `;
        
        // Очищаем URL от данных, чтобы не висели в строке
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Запускаем проверку при загрузке страницы
    checkAuth();
</script>

</body>
</html>
