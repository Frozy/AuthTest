<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Kernel v5.0</title>
    <style>
        :root {
            --accent: #0088cc;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #1e40af 0%, #020617 100%);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Живое синее пятно на фоне */
        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: var(--accent);
            filter: blur(130px);
            border-radius: 50%;
            z-index: -1;
            animation: float 15s infinite alternate;
        }

        @keyframes float {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 50px 30px;
            width: 360px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        h2 { font-weight: 500; margin-bottom: 15px; letter-spacing: 1px; }
        p { opacity: 0.5; font-size: 14px; margin-bottom: 30px; }

        /* Та самая синяя кнопка */
        .btn-init {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0088cc, #005580);
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 136, 204, 0.3);
        }

        .btn-init:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 136, 204, 0.5);
            background: #00aaff;
        }

        .data-display {
            display: none;
            text-align: left;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.2);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <h2>Cloud Access</h2>
    <p id="desc">Инициализация защищенного соединения с узлом Telegram</p>
    
    <button class="btn-init" id="init-btn" onclick="openAuth()">ИНИЦИАЛИЗИРОВАТЬ</button>

    <div id="result" class="data-display"></div>
</div>

<script>
    // СЮДА ПИШИ АЙДИ СВОЕГО БОТА (ТОЛЬКО ЦИФРЫ)
    const botId = "8791295405"; 

    function openAuth() {
        const origin = window.location.origin;
        // Открываем официальное окно Telegram. Номер телефона там введет сам юзер.
        const authUrl = `https://oauth.telegram.org/auth?bot_id=${botId}&origin=${origin}&request_access=write&embed=1`;
        
        // Открываем окно по центру
        const authWindow = window.open(authUrl, "tg_auth", "width=500,height=600");

        document.getElementById('init-btn').innerText = "ОЖИДАНИЕ...";
        
        // Следим за закрытием окна
        const checkWindow = setInterval(() => {
            if (authWindow.closed) {
                clearInterval(checkWindow);
                showSuccess();
            }
        }, 500);
    }

    function showSuccess() {
        document.getElementById('init-btn').style.display = 'none';
        document.getElementById('desc').style.display = 'none';
        
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';
        
        resDiv.innerHTML = `
            <b style="color:white">СОЕДИНЕНИЕ УСТАНОВЛЕНО:</b><br><br>
            [STATUS] SESSION_ACTIVE<br>
            [INFO] DATA_ENCRYPTED: YES<br>
            [AUTH] TOKEN_RECEIVED<br>
            <br>
            <span style="color:#4ade80">> Профиль успешно привязан.</span>
        `;
    }
</script>

</body>
</html>
